<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵金属年报摘要库</title>
<style>
:root {
  --ink: #1F2430; --ink-2: #5A6272; --ink-3: #9AA1AF;
  --line: #E3E6EC; --bg: #F7F8FA; --card: #FFF;
  --brand: #6B7FD7; --brand-ink: #43509E; --brand-bg: #EEF0FA;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
.hero {
  background: linear-gradient(135deg, #EEF0FA 0%, #F7F8FA 70%);
  border-bottom: 1px solid var(--line);
  padding: 34px 32px 26px;
}
.hero h1 { font-size: 24px; letter-spacing: .5px; }
.hero p { color: var(--ink-2); margin-top: 6px; font-size: 13.5px; }
.hero .stats { margin-top: 14px; display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.hero .stats b { color: var(--brand-ink); font-size: 16px; margin-right: 4px; }

.controls {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 32px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.search {
  flex: 1 1 260px; max-width: 420px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px;
}
.search:focus-within { border-color: var(--brand); }
.search svg { flex: none; stroke: var(--ink-3); }
.search input {
  border: none; outline: none; background: none; flex: 1;
  font-size: 14px; color: var(--ink);
}
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  font-size: 12.5px; border-radius: 20px; padding: 4px 12px; cursor: pointer;
  transition: all .15s;
}
.cat-btn:hover { border-color: var(--brand); color: var(--brand-ink); }
.cat-btn.on { background: var(--brand-ink); border-color: var(--brand-ink); color: #fff; }
.count { font-size: 12.5px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }

.grid-wrap { max-width: 1480px; margin: 0 auto; padding: 22px 32px 60px; }
.grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
@media (max-width: 1240px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 920px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px)  { .grid { grid-template-columns: 1fr; } }

.card {
  position: relative; display: block; text-decoration: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px 14px; overflow: hidden;
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.card:hover {
  border-color: var(--brand); box-shadow: 0 4px 16px rgba(67,80,158,.10);
  transform: translateY(-2px);
}
.card .bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.card .row1 { display: flex; align-items: baseline; gap: 8px; }
.card .name {
  font-size: 15.5px; font-weight: 700; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.card .code { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.card .brief {
  margin-top: 8px; color: var(--ink-2); font-size: 12.8px; line-height: 1.55;
  height: 3.1em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card .row3 {
  margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
}
.badge {
  font-size: 11.5px; border-radius: 4px; padding: 2px 8px;
  color: #fff; white-space: nowrap;
}
.card .upd { font-size: 11.5px; color: var(--ink-3); }
.empty {
  grid-column: 1 / -1; text-align: center; color: var(--ink-3);
  padding: 60px 0; font-size: 14px;
}
.foot {
  text-align: center; color: var(--ink-3); font-size: 12px; padding: 18px 0 30px;
}
kbd {
  background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; font-size: 11.5px; color: var(--ink-2);
}
</style>
</head>
<body>

<div class="hero">
  <h1>贵金属年报摘要库</h1>
  <p>51 家金银 / PGM / 副产银 / 精炼公司 · 年度报告核心数据 · 供需基本面研究底稿</p>
  <div class="stats">
    <span><b id="st-total">0</b>家公司</span>
    <span><b id="st-cats">0</b>个分类</span>
    <span><b id="st-updated">__BUILD_TIME__</b>最近构建</span>
  </div>
</div>

<div class="controls">
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="text" placeholder="搜索公司 / 代码 / 关键词…  （/ 聚焦）" autocomplete="off">
  </label>
  <div class="cats" id="cats"></div>
  <span class="count" id="count"></span>
</div>

<div class="grid-wrap"><div class="grid" id="grid"></div></div>
<div class="foot">点击卡片查看年报摘要全文 · 数据目录：precious-metals/年报 · 增量构建，新增公司自动出现</div>

<script>
"use strict";
const COMPANIES = __COMPANIES_JSON__;
const CAT_COLORS = __CAT_COLORS_JSON__;

const $ = id => document.getElementById(id);
const grid = $("grid"), q = $("q"), catsBox = $("cats"), countEl = $("count");

// ---- 分类按钮 ----
const catOrder = [];
const catCount = {};
COMPANIES.forEach(c => {
  if (!catOrder.includes(c.category)) catOrder.push(c.category);
  catCount[c.category] = (catCount[c.category] || 0) + 1;
});
catOrder.sort((a, b) => catCount[b] - catCount[a]);
let activeCat = "";

function renderCats() {
  const frag = document.createDocumentFragment();
  const all = btn("全部", "");
  frag.appendChild(all);
  catOrder.forEach(cat => frag.appendChild(btn(cat + " " + catCount[cat], cat)));
  catsBox.innerHTML = "";
  catsBox.appendChild(frag);

  function btn(label, val) {
    const b = document.createElement("button");
    b.className = "cat-btn" + (activeCat === val ? " on" : "");
    b.textContent = label;
    b.onclick = () => { activeCat = val; renderCats(); renderGrid(); };
    return b;
  }
}

// ---- 卡片 ----
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function renderGrid() {
  const kw = q.value.trim().toLowerCase();
  const list = COMPANIES.filter(c => {
    if (activeCat && c.category !== activeCat) return false;
    if (!kw) return true;
    return (c.name + " " + c.code + " " + c.category + " " + c.brief + " " + c.hq).toLowerCase().includes(kw);
  });
  countEl.textContent = list.length ? `显示 ${list.length} / ${COMPANIES.length}` : "";
  if (!list.length) {
    grid.innerHTML = '<div class="empty">没有匹配的公司，换个关键词试试</div>';
    return;
  }
  grid.innerHTML = list.map(c => {
    const color = CAT_COLORS[c.category] || "#8C8C8C";
    return '<a class="card" href="' + esc(c.url) + '">' +
      '<span class="bar" style="background:' + color + '"></span>' +
      '<div class="row1"><span class="name" title="' + esc(c.name) + '">' + esc(c.name) + '</span>' +
      '<span class="code">' + esc(c.code || c.id) + '</span></div>' +
      '<div class="brief" title="' + esc(c.brief) + '">' + esc(c.brief || "—") + '</div>' +
      '<div class="row3"><span class="badge" style="background:' + color + '">' + esc(c.category) + '</span>' +
      '<span class="upd">更新 ' + esc(c.updated) + '</span></div>' +
      '</a>';
  }).join("");
}

// ---- 事件 ----
q.addEventListener("input", renderGrid);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape") { q.value = ""; renderGrid(); }
});

// ---- init ----
$("st-total").textContent = COMPANIES.length;
$("st-cats").textContent = catOrder.length;
renderCats();
renderGrid();
</script>
</body>
</html>
